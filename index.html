<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XRPL Destination Tag検索 v2</title><style>
:root{color-scheme:light;--ink:#123b4c;--sea:#087b91;--line:#a8d2da}
*{box-sizing:border-box}html{min-width:0}body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;max-width:820px;margin:0 auto;padding:24px 16px 55px;color:var(--ink);background:transparent;min-width:0}
html{min-height:100%;background:linear-gradient(165deg,rgba(228,250,251,.93),rgba(246,252,250,.97) 40%,rgba(218,240,239,.96)),linear-gradient(120deg,#6cc5d2,#eff9f6)}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.48;background:radial-gradient(ellipse 110% 25% at 85% 97%,#49b1bc 0 27%,transparent 28%),radial-gradient(ellipse 100% 20% at 2% 100%,#85d5d9 0 38%,transparent 39%),radial-gradient(ellipse 110% 15% at 45% 100%,#d7f4ec 0 52%,transparent 53%)}
h2{font-size:clamp(23px,5vw,34px);margin:0 0 12px;letter-spacing:-.03em;color:#075a70}h2:before{content:"🏄  ";font-size:.88em}p{line-height:1.65}label{font-weight:700;display:block;margin-bottom:6px;line-height:1.4}small{color:#436875;line-height:1.6;display:block}
input,textarea,button{box-sizing:border-box;width:100%;max-width:100%;min-width:0;font:inherit;padding:12px;margin:0 0 16px;border:1px solid var(--line);border-radius:12px}input,textarea{background:rgba(255,255,255,.96);color:#153f50;min-height:48px}textarea{resize:vertical}input[type=date]{appearance:auto;-webkit-appearance:auto;display:block;width:100%;min-width:0;font-size:16px;padding:10px 8px}input:focus,textarea:focus{outline:2px solid #2c99ab;outline-offset:1px}button{background:#087c94;color:white;border:0;font-weight:700;min-height:50px;cursor:pointer}button:disabled{opacity:.42;cursor:default}
.dates{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:2px}.dates>div{min-width:0;width:100%}.dates label{font-size:14px;min-height:40px}.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.controls button{margin:0 0 4px}.scroll{overflow-x:auto;max-width:100%;background:rgba(255,255,255,.88);border-radius:12px}table{border-collapse:collapse;width:100%;font-size:12px}td,th{border:1px solid #c9e0e4;padding:8px;word-break:break-all;text-align:left}th{background:#d8f1f2}#status{white-space:pre-wrap;background:rgba(255,255,255,.82);padding:15px;border-radius:12px;border-left:4px solid #27a4b2}
@media(max-width:560px){body{padding:20px 14px 44px}.dates{grid-template-columns:minmax(0,1fr);gap:0}.dates label{min-height:0}.dates input{margin-bottom:14px}.controls{gap:8px}.controls button{font-size:15px;padding:12px 6px}}
</style></head><body><h2>XRPL Destination Tag検索 v2</h2><p>指定したXRP入金先アドレスとDestination Tagが一致する、成功したXRP Paymentを公開台帳から抽出します。</p><label>送金先アドレス（1行に1件）</label><textarea id="addresses" rows="3" placeholder="rで始まるアドレス"></textarea><label>Destination Tag</label><input id="tag" inputmode="numeric" placeholder="数字のタグ"><div class="dates"><div><label>開始日（UTC）</label><input id="start" type="date"></div><div><label>終了日（UTC・当日含む）</label><input id="end" type="date"></div></div><small>期間は任意。未入力なら制限なし。検索結果の取引日時をUTCで判定します。期間を指定してもRPC取得量が減るとは限りません。</small><p><label>XRPL RPC URL</label><input id="rpc" value="https://xrplcluster.com/"></p><div class="controls"><button id="run">新規検索</button><button id="pause" disabled>一時停止</button><button id="resume" disabled>再開</button><button id="stop" disabled>検索中止</button></div><button id="csv" disabled>CSVを保存（検索途中でも可）</button><p id="status" aria-live="polite">未実行</p><div class="scroll"><table><thead><tr><th>日時(UTC)</th><th>送金元</th><th>送金先</th><th>Tag</th><th>XRP</th><th>TXID</th><th>Ledger</th></tr></thead><tbody id="results"></tbody></table></div><p><small>検索はページ単位で停止・再開します。Safariを閉じたりページを再読み込みすると進捗は失われます。RPCが履歴を全件提供する保証はありません。公開リポジトリに捜査情報を保存しないでください。</small></p><script>
'use strict';const el=id=>document.getElementById(id);const sleep=ms=>new Promise(r=>setTimeout(r,ms));let state='idle',rows=[],job=null,waiter=null;const status=s=>el('status').textContent=s;const setState=s=>{state=s;el('run').disabled=s==='running'||s==='paused';el('pause').disabled=s!=='running';el('resume').disabled=s!=='paused';el('stop').disabled=s!=='running'&&s!=='paused';el('csv').disabled=rows.length===0;for(const id of ['addresses','tag','start','end','rpc'])el(id).disabled=s==='running'||s==='paused'};function wake(){if(waiter){waiter();waiter=null}}async function checkpoint(){while(state==='paused')await new Promise(r=>waiter=r);if(state!=='running')throw Error('検索中止')}function toUTC(x){return Number.isInteger(x)?new Date((x+946684800)*1000).toISOString():''}function addRow(r){const tr=document.createElement('tr');for(const v of [r.date,r.from,r.to,r.tag,r.xrp,r.hash,r.ledger]){const td=document.createElement('td');td.textContent=String(v);tr.appendChild(td)}el('results').appendChild(tr)}async function rpcCall(url,params){for(let attempt=0;attempt<9;attempt++){await checkpoint();try{const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({method:'account_tx',params:[params]})});const json=await res.json();const result=json.result;const msg=String(result?.error_message||result?.error||json?.message||'');if(res.status===429||/rate limit|quota|too many requests/i.test(msg)){if(attempt===8)throw Error('通信量制限が続いています');const m=msg.match(/retry in\s*~?(\d+)ms/i);const delay=Math.min(60000,Math.max(10000,m?Number(m[1])+3000:10000*Math.pow(1.5,attempt)));status('通信制限：'+Math.ceil(delay/1000)+'秒待機して再試行します');for(let elapsed=0;elapsed<delay;elapsed+=500){await checkpoint();await sleep(Math.min(500,delay-elapsed))}continue}if(!res.ok)throw Error('HTTP '+res.status+' '+msg);if(!result||result.status==='error'||result.error)throw Error(msg||'RPC応答エラー');return result}catch(e){if(/Failed to fetch|NetworkError|Load failed/i.test(String(e.message))&&attempt<3){await sleep(5000*(attempt+1));continue}throw e}}throw Error('再試行回数を超えました')}
el('pause').onclick=()=>{setState('paused');status('一時停止を要求しました。現在の通信が終了した後、次のページの取得前に停止します。')};el('resume').onclick=()=>{setState('running');wake();status('検索を再開しました')};el('stop').onclick=()=>{setState('stopped');wake();status('中止を要求しました。取得済みの一致結果はCSVで保存できます。')};el('run').onclick=async()=>{const addresses=[...new Set(el('addresses').value.split(/[\s,;]+/).filter(Boolean))],tag=el('tag').value.trim(),url=el('rpc').value.trim(),start=el('start').value,end=el('end').value;if(!addresses.length||addresses.some(a=>!/^r[1-9A-HJ-NP-Za-km-z]{24,34}$/.test(a))||!/^(0|[1-9]\d*)$/.test(tag)||Number(tag)>4294967295){status('アドレスまたはDestination Tagを確認してください');return}if(!/^https:\/\//.test(url)){status('HTTPSのRPC URLを入力してください');return}if(start&&end&&start>end){status('開始日は終了日以前にしてください');return}rows=[];job={addresses,tag,url,start,end,scanned:0,pages:0};el('results').replaceChildren();setState('running');try{for(let i=0;i<addresses.length;i++){let marker,seen=new Set();do{await checkpoint();const params={account:addresses[i],ledger_index_min:-1,ledger_index_max:-1,limit:200,forward:false};if(marker!==undefined)params.marker=marker;const result=await rpcCall(url,params);job.pages++;for(const item of result.transactions||[]){job.scanned++;const tx=item.tx||item.tx_json||item.transaction||{},meta=item.meta||{},date=toUTC(tx.date);if(tx.TransactionType!=='Payment'||tx.Destination!==addresses[i]||String(tx.DestinationTag)!==tag||meta.TransactionResult!=='tesSUCCESS'||typeof tx.Amount!=='string'||!/^\d+$/.test(tx.Amount))continue;if(!date||(start&&date.slice(0,10)<start)||(end&&date.slice(0,10)>end))continue;const row={date,from:tx.Account||'',to:tx.Destination,tag:tx.DestinationTag,xrp:(Number(tx.Amount)/1e6).toString(),hash:tx.hash||item.hash||'',ledger:tx.ledger_index||item.ledger_index||''};rows.push(row);addRow(row)}marker=result.marker;el('csv').disabled=rows.length===0;status(`アドレス ${i+1}/${addresses.length} / ${job.pages}ページ / 確認 ${job.scanned}件 / 期間内Tag一致 ${rows.length}件`);if(marker!==undefined){const key=JSON.stringify(marker);if(seen.has(key))throw Error('同じページ位置が繰り返されました');seen.add(key);for(let ms=0;ms<2500;ms+=250){await checkpoint();await sleep(250)}}}while(marker!==undefined)}status(`検索終了。確認 ${job.scanned}件、期間内Tag一致 ${rows.length}件。※RPCの履歴網羅性は別途確認が必要です。`)}catch(e){status(`${state==='stopped'?'検索中止':'検索停止：'+e.message}。確認 ${job.scanned}件、一致 ${rows.length}件。取得済み結果はCSV保存可能です。`)}finally{setState('idle')}};el('csv').onclick=()=>{if(!rows.length)return;const headers=['date_utc','sender','destination','destination_tag','xrp','txid','ledger'],fields=['date','from','to','tag','xrp','hash','ledger'],quote=x=>'"'+String(x??'').replace(/"/g,'""')+'"';const csv='\ufeff'+[headers.join(','),...rows.map(r=>fields.map(f=>quote(r[f])).join(','))].join('\r\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='xrpl_tag_results_partial.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),10000)};
</script></body></html>
