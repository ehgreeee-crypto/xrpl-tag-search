<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XRPL Destination Tag検索</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:750px;margin:24px auto;padding:0 16px;color:#17212b}input,textarea,button{box-sizing:border-box;width:100%;font:inherit;padding:12px;margin:6px 0 14px;border:1px solid #bbc6d0;border-radius:8px}button{background:#1258a5;color:white;border:0;font-weight:700}button:disabled{opacity:.5}label{font-weight:600}small{color:#596775}table{border-collapse:collapse;width:100%;font-size:12px}td,th{border:1px solid #ccd;padding:6px;word-break:break-all;text-align:left}.scroll{overflow-x:auto}#status{white-space:pre-wrap;background:#f1f5f9;padding:12px;border-radius:8px}</style></head><body><h2>XRPL Destination Tag検索</h2><p>指定したXRPLアドレスへの成功したXRP Paymentのうち、Destination Tagが一致するものを抽出します。公開台帳のみを検索します。</p><label>検索対象の送金先アドレス（1行に1件）</label><textarea id="addresses" rows="4" placeholder="rで始まるXRPLアドレスを入力"></textarea><label>Destination Tag</label><input id="tag" inputmode="numeric" placeholder="数字のタグ"><label>XRPL RPC URL</label><input id="rpc" value="https://xrplcluster.com/"><button id="run">検索開始</button><button id="stop" disabled>中止</button><button id="csv" disabled>CSVを保存</button><p id="status">未実行</p><div class="scroll"><table><thead><tr><th>日時(UTC)</th><th>送金元</th><th>送金先</th><th>Tag</th><th>XRP</th><th>TXID</th><th>Ledger</th></tr></thead><tbody id="results"></tbody></table></div><p><small>注意：検索対象は入力したアドレスのみです。全OKXアドレスを自動発見する機能はありません。RPCの履歴範囲・接続制限によって検索が不完全になる場合があります。タグ一致のみで個人や取引所口座の帰属は確定できません。公開リポジトリに捜査情報を記載しないでください。</small></p><script>
let cancel=false,rows=[];const el=id=>document.getElementById(id);const status=s=>el('status').textContent=s;const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function rpcCall(url,params){const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({method:'account_tx',params:[params]})});if(!res.ok)throw Error('HTTP '+res.status);const json=await res.json();const result=json.result;if(!result||result.status==='error'||result.error)throw Error(result?.error_message||result?.error||'RPC応答エラー');return result}function toUTC(x){if(!Number.isInteger(x))return '';return new Date((x+946684800)*1000).toISOString()}function addRow(r){const tr=document.createElement('tr');for(const v of [r.date,r.from,r.to,r.tag,r.xrp,r.hash,r.ledger]){const td=document.createElement('td');td.textContent=String(v);tr.appendChild(td)}el('results').appendChild(tr)}el('stop').onclick=()=>{cancel=true;status('中止を要求しました。現在の通信終了後に停止します。')};el('run').onclick=async()=>{const addresses=[...new Set(el('addresses').value.split(/[\s,;]+/).map(s=>s.trim()).filter(Boolean))];const tag=el('tag').value.trim();const url=el('rpc').value.trim();if(!addresses.length||addresses.some(a=>!/^r[1-9A-HJ-NP-Za-km-z]{24,34}$/.test(a))||!/^(0|[1-9]\d*)$/.test(tag)||Number(tag)>4294967295){status('アドレスまたはDestination Tagを確認してください。');return}if(!/^https:\/\//.test(url)){status('HTTPSのRPC URLを入力してください。');return}rows=[];el('results').replaceChildren();el('run').disabled=true;el('stop').disabled=false;el('csv').disabled=true;cancel=false;let scanned=0;try{for(let i=0;i<addresses.length&&!cancel;i++){let marker,seen=new Set(),pages=0;do{const params={account:addresses[i],ledger_index_min:-1,ledger_index_max:-1,limit:200,forward:false};if(marker!==undefined)params.marker=marker;const result=await rpcCall(url,params);pages++;for(const item of result.transactions||[]){scanned++;const tx=item.tx||item.tx_json||item.transaction||{};const meta=item.meta||{};if(tx.TransactionType!=='Payment'||tx.Destination!==addresses[i]||String(tx.DestinationTag)!==tag||meta.TransactionResult!=='tesSUCCESS'||typeof tx.Amount!=='string'||!/^\d+$/.test(tx.Amount))continue;const row={date:toUTC(tx.date),from:tx.Account||'',to:tx.Destination,tag:tx.DestinationTag,xrp:(Number(tx.Amount)/1e6).toString(),hash:tx.hash||item.hash||'',ledger:tx.ledger_index||item.ledger_index||''};rows.push(row);addRow(row)}marker=result.marker;status(`アドレス ${i+1}/${addresses.length} / ${pages}ページ / 確認 ${scanned}件 / 一致 ${rows.length}件`);if(marker!==undefined){const key=JSON.stringify(marker);if(seen.has(key))throw Error('同じページ位置が繰り返されました');seen.add(key)}}while(marker!==undefined&&!cancel)}status(`${cancel?'中止':'検索終了'}。確認 ${scanned}件、一致 ${rows.length}件。※RPCの履歴網羅性は別途確認が必要です。`)}catch(e){status(`検索停止：${e.message}。確認 ${scanned}件、一致 ${rows.length}件。通信制限やCORS設定の可能性があります。`)}finally{el('run').disabled=false;el('stop').disabled=true;el('csv').disabled=rows.length===0}};el('csv').onclick=()=>{const headers=['date_utc','sender','destination','destination_tag','xrp','txid','ledger'];const fields=['date','from','to','tag','xrp','hash','ledger'];const quote=x=>'"'+String(x??'').replace(/"/g,'""')+'"';const csv='\ufeff'+[headers.join(','),...rows.map(r=>fields.map(f=>quote(r[f])).join(','))].join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='xrpl_tag_results.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></body></html>
